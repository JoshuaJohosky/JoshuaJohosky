<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RISK: Minecraft Global Domination</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo"><span class="risk">RISK</span> · <span class="mc">Minecraft</span> Global Domination</div>
    <div class="turn-info">
      <span class="pill" id="modePill">—</span>
      <span class="pill" id="roundPill">Round —</span>
      <span class="pill" id="playerPill">—</span>
      <button class="btn small" id="soundBtn" title="Toggle sound">🔊</button>
      <button class="btn small" id="rulesBtn">Rules</button>
      <button class="btn small" id="newGameBtn">New Game</button>
    </div>
  </div>

  <div id="main">
    <div id="boardWrap">
      <svg id="board" viewBox="0 0 1250 1720" preserveAspectRatio="xMidYMin meet"></svg>
      <div id="turnBanner" class="turn-banner"></div>
    </div>

    <div id="side">
      <div id="phasebar">
        <div class="step" data-phase="place">1 · Reinforce</div>
        <div class="step" data-phase="attack">2 · Attack</div>
        <div class="step" data-phase="fortify">3 · Fortify</div>
      </div>

      <div class="section">
        <div id="hint">Welcome, explorer.</div>
        <div class="btn-row" id="phaseControls" style="margin-top:8px;"></div>
      </div>

      <div class="section" id="specialSection">
        <h3>Reinforcements / Specials</h3>
        <div id="reserveInfo" class="help"></div>
        <div class="btn-row" id="specialBtns" style="margin-top:8px;"></div>
      </div>

      <div class="section">
        <h3>Tokens (keys)</h3>
        <div id="tokenList"></div>
      </div>

      <div class="section">
        <h3>Reward Cards</h3>
        <div id="cardList" class="help">None yet.</div>
      </div>

      <div class="section" style="flex:1; display:flex; flex-direction:column; min-height:0; padding-bottom:0;">
        <h3>Game Log</h3>
        <div id="log"></div>
      </div>
    </div>
  </div>
</div>

<div id="overlayHost"></div>

<script src="js/data.js"></script>
<script src="js/cards.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/effects.js"></script>
<script src="js/app.js"></script>
</body>
</html>
